services:
  - type: web
    name: validbridge
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python server.py"
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: BASE_URL
        value: https://validbridge.onrender.com
